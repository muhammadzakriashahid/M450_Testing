<form (ngSubmit)="login()" #loginForm="ngForm">
  <label>
    Username:
    <input name="username" [(ngModel)]="username" required />
  </label>
  <label>
    Password:
    <input name="password" type="password" [(ngModel)]="password" required />
  </label>
  <button type="submit">Login</button>
  <div *ngIf="error">{{ error }}</div>
</form>
